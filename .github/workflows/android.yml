name: Build L4D1 Android Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - launcher-v0.4
      - launcher-v0.5

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "===== ANDROID SDK ====="
          echo "$ANDROID_SDK_ROOT"
          ls -lah "$ANDROID_SDK_ROOT"
          echo "===== INSTALLED PLATFORMS ====="
          ls -lah "$ANDROID_SDK_ROOT/platforms" || true

      - name: Install Android NDK and CMake
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Package ARM64 Probe
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          CMAKE="$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"

          "$CMAKE" -S app/src/main/cpp -B build/wine-probe \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29

          "$CMAKE" --build build/wine-probe --target wine_probe

          mkdir -p app/src/main/jniLibs/arm64-v8a

          cp build/wine-probe/wine_probe \
            app/src/main/jniLibs/arm64-v8a/libwineprobe.so

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build ARM64 Wine Probe
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          CMAKE="$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"

          "$CMAKE" -S app/src/main/cpp -B build/wine-probe \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29

          "$CMAKE" --build build/wine-probe --target wine_probe

          ls -lh build/wine-probe/wine_probe

      - name: Upload ARM64 Wine Probe
        uses: actions/upload-artifact@v4
        with:
          name: L4D2-ARM64-Wine-Probe
          path: build/wine-probe/wine_probe
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: L4D1-Android-Prototype
          path: app/build/outputs/apk/debug/*.apk
