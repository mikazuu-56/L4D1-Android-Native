plugins {
    id 'com.android.application'
}

android {
    namespace 'com.l4d1.android'
    compileSdk 35
    ndkVersion '27.2.12479018'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    defaultConfig {
        applicationId 'com.l4d1.android'

        ndk {
            abiFilters 'arm64-v8a'
        }

        minSdk 29
        targetSdk 28
        versionCode 9
        versionName "0.9"
    }
}
